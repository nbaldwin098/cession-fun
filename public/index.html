<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>For You | Cession</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="cx-top">
    <button class="cx-wordmark" type="button" onclick="CessionUI.go('home')">CESSION</button>
    <div class="cx-top-right">
      <button class="cx-connect" id="btnConnectWallet" type="button">Connect</button>
    </div>
  </header>
  <div class="cx-app">
    <main class="page-view active" id="viewHome"><h1 class="cx-title">For You</h1><div class="cx-feed" id="forYouCoinsGrid"></div></main>
    <main class="page-view" id="viewExplorePulse"><h1 class="cx-title">Pulse</h1><h2 class="cx-h2">Top 10 best</h2><div class="cx-feed" id="pulseBestGrid"></div><h2 class="cx-h2">Top 10 worst</h2><div class="cx-feed" id="pulseWorstGrid"></div><h2 class="cx-h2">Bundles</h2><div class="cx-feed" id="pulseBundleGrid"></div></main>
    <main class="page-view" id="viewWallet"><h1 class="cx-title">Wallet</h1><div id="walletScreenDisconnected"><div class="cx-card"><h2>Connect a wallet</h2><p>Connect once per visit. We do not hold keys.</p><button class="cx-door phantom" type="button" onclick="CessionUI.connectPhantom()">Connect Phantom</button><button class="cx-door metamask" type="button" onclick="CessionUI.connectMetaMask()">Connect MetaMask</button><p class="cx-muted" id="walletExtHint"></p></div></div><div id="walletScreenConnected" style="display:none;"><div class="cx-card"><div class="cx-mono" id="walletScreenAddress">-</div><button class="cx-ghost" type="button" onclick="CessionUI.openSettings()">Settings</button></div></div></main>
    <main class="page-view" id="viewExplore"><h1 class="cx-title">Explore</h1><input class="cx-search" id="tokenSearchInput" type="search" placeholder="Search live coins"><button class="cx-launch" type="button" onclick="CessionUI.openCreate()">Create a coin (0.05 SOL)</button><div class="cx-card" style="margin-top:16px;"><button class="cx-ghost" type="button" disabled>Perpetuals - not live</button><button class="cx-ghost" type="button" disabled>Predictions - not live</button><button class="cx-ghost" type="button" disabled>Rewards - not live</button><button class="cx-ghost" type="button" disabled>Market data - not live</button><button class="cx-launch" type="button" style="width:100%;margin-top:16px;" onclick="CessionUI.openStake()">Stake SOL with Phantom</button></div></main>
    <main class="page-view" id="viewProfile"><h1 class="cx-title">You</h1><div class="cx-card" id="youLoggedOut"><p>Connect a wallet to see holdings and statements.</p><button class="cx-launch" type="button" onclick="CessionUI.open('walletModal')">Connect wallet</button></div><div class="cx-card" id="youLoggedIn" style="display:none;"><div class="cx-mono" id="profileAddressFull">-</div><button class="cx-ghost" type="button" onclick="CessionUI.openSettings()">Settings</button><button class="cx-ghost" type="button" onclick="CessionUI.openStatement()">Statement</button></div><footer class="cx-you-footer"><a href="#about">About</a><a href="#terms">Terms</a><a href="#risk">Risk</a><a href="#transparency">Transparency</a><a href="#support">Support</a></footer></main>
    <main class="page-view" id="viewCoin"><button class="cx-ghost" type="button" onclick="CessionUI.go('home')">Back</button><h1 class="cx-title" id="coinTitle">Coin</h1><div class="cx-trade-row"><button class="cx-launch" type="button" onclick="CessionUI.openTrade('buy')">Buy</button><button class="cx-ghost" type="button" onclick="CessionUI.openTrade('sell')">Sell</button></div></main>
  </div>
  <nav class="bottom-nav-bar" id="bottomNav">
    <button class="bottom-nav-slot active" id="bnavForYou" type="button" onclick="CessionUI.go('home')"><span class="bnav-label">For You</span></button>
    <button class="bottom-nav-slot" id="bnavPulse" type="button" onclick="CessionUI.go('pulse')"><span class="bnav-label">Pulse</span></button>
    <button class="bottom-nav-slot" id="bnavWallet" type="button" onclick="CessionUI.go('wallet')"><span class="bnav-label">Wallet</span></button>
    <button class="bottom-nav-slot" id="bnavExplore" type="button" onclick="CessionUI.go('explore')"><span class="bnav-label">Explore</span></button>
    <button class="bottom-nav-slot" id="bnavYou" type="button" onclick="CessionUI.go('you')"><span class="bnav-label">You</span></button>
  </nav>
  <div class="modal-overlay-generic" id="deployModal"><div class="modal-box-pump"><strong>Launch coin</strong><form id="deployCoinForm"><input id="deployName" required><input id="deploySymbol" required><button type="submit">Launch</button></form></div></div>
  <div class="modal-overlay-generic" id="walletModal"><div class="modal-box-pump"><button type="button" onclick="CessionUI.connectPhantom()">Connect Phantom</button><button type="button" onclick="CessionUI.connectMetaMask()">Connect MetaMask</button><p id="walletExtHintModal"></p></div></div>
  <div class="modal-overlay-generic" id="settingsModal"><div class="modal-box-pump"><div id="settingsWalletAddress">Not connected</div></div></div>
  <div class="modal-overlay-generic" id="statementModal"><div class="modal-box-pump"><div id="statementBody">No statements to display.</div><button id="statementDownloadBtn" type="button" style="display:none;" onclick="CessionUI.downloadCsv()">Download statement</button></div></div>
  <div class="modal-overlay-generic" id="stakeModal"><div class="modal-box-pump"><button type="button" onclick="CessionUI.openPhantomStake()">Open Phantom stake</button></div></div>
  <div class="modal-overlay-generic" id="tradeModal"><div class="modal-box-pump"><input id="tradeAmount" type="number"><button type="button" onclick="CessionUI.confirmTrade()">Confirm</button></div></div>
  <script src="js/cession-shell.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/trading.js"></script>
</body></html>

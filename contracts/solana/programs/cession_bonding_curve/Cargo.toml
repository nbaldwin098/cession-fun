[package]
name = "cession_bonding_curve"
version = "0.1.0"
description = "Cession Fair-Launch Solana Bonding Curve Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cession_bonding_curve"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"

# Deployment cost on Solana is proportional to the compiled program's on-chain size
# (rent is paid per byte). These settings shrink the binary without changing any logic:
# opt-level/lto/codegen-units minimize size, strip drops debug symbols. overflow-checks
# is kept on (small size cost) so bonding-curve math panics instead of silently wrapping
# on overflow/underflow — a financial-grade safety requirement that outweighs the size hit.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
overflow-checks = true
panic = "abort"
